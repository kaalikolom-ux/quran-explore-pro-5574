name: Build Quran Explore Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Collect Output APK
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/Quran-Explore-Offline-v1.0.apk \;
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Explore-Offline-APK
          path: dist-apk/Quran-Explore-Offline-v1.0.apk

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Quran Explore Offline APK v1.0.0
          body: |
            ## 📱 কুরআন অন্বেষা — অফলাইন অ্যান্ড্রয়েড APK ইন্সটলার (Quran Explore Offline APK)
            
            সরাসরি নিচের ডাউনলোড লিঙ্ক থেকে `.apk` ফাইলটি ডাউনলোড করে আপনার অ্যান্ড্রয়েড মোবাইলে ইন্সটল করুন।
            
            ### 🌟 এই APK-এর সুবিধা:
            - **কোনো ভুল "ইন্টারনেট সংযোগ নেই" এরর স্ক্রিন নেই**
            - **অফলাইন মোড সাপোর্ট:** ইন্টারনেট বন্ধ থাকলেও সুরা ও অডিও বাজবে
            - **ফুল স্ক্রিন মোবাইল এক্সপেরিয়েন্স**
          files: dist-apk/Quran-Explore-Offline-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
